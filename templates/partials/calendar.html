<section class="panel week-panel" aria-labelledby="week-title"><div class="section-heading"><div><h2 id="week-title">A look ahead</h2><p class="subtle small">Your deadlines over the next seven days</p></div><span class="small subtle">{{ today.strftime('%b %d') }} → {{ week[-1].short_label }}</span></div>
          <div class="week-strip">{% for day in week %}<a class="day {{ 'current' if loop.first }} {{ 'selected-day' if date_filter == day.date }}" href="{{ url_for('home', view='week', date=day.date, course=course_filter, type=type_filter, priority=priority_filter) }}#plan" aria-label="{{ day.full_label }}: {{ day.tasks|length }} pending items"><span>{{ day.label }}</span><strong>{{ day.number }}</strong><div class="day-dots" aria-label="{{ day.tasks|length }} pending items">{% for kind in day.kinds %}<i title="{{ kinds[kind] }}" class="{{ kind }}"></i>{% endfor %}</div></a>{% endfor %}</div><div class="legend"><span><i class="assignment"></i>Assignment</span><span><i class="exam"></i>Exam</span><span><i class="study-session"></i>Study session</span></div>
        </section>
